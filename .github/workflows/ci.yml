name: CI

on:
  # Every push to main builds, tests and publishes; a push of only the docs, the site or the README's pictures does not.
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', '.github/assets/**']
  # Or by hand: Actions → CI → Run workflow.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to the commit their tag names: a tag can be moved to other code, a commit cannot.
jobs:
  build:
    # Only the public repo builds: a copy of it (the private preview) never does.
    if: github.repository == 'waveeihq/waveei'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      version: ${{ steps.version.outputs.code }}
      name: ${{ steps.version.outputs.name }}
      signed: ${{ steps.signing.outputs.signed }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
      - name: Version
        id: version
        # The code: minutes since 2026-01-01 UTC, so every build is newer than the last. The name people see:
        # major.minor.patch, the major and minor as gradle.properties' appVersion says (raised by hand: the major for a
        # big change, the minor for new features), the patch one more than the releases already published under them,
        # so each minor starts at .1.
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          code=$(( ($(date +%s) - 1767225600) / 60 ))
          minor=$(sed -n 's/^appVersion=//p' gradle.properties)
          patch=$(gh release list --limit 1000 --json name --jq "[.[] | select(.name | startswith(\"$minor.\"))] | length + 1")
          name="$minor.$patch"
          echo "VERSION_CODE=$code" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$name" >> "$GITHUB_ENV"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - name: Signing key
        id: signing
        env:
          SIGNING_KEYSTORE: ${{ secrets.SIGNING_KEYSTORE }}
        run: |
          if [ -n "$SIGNING_KEYSTORE" ]; then
            echo "$SIGNING_KEYSTORE" | base64 -d > "$RUNNER_TEMP/upload.p12"
            echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/upload.p12" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::SIGNING_KEYSTORE is not set: the release build comes out unsigned and is not published"
          fi
      - run: ./gradlew :core:test :android:testDebugUnitTest :android:assembleRelease
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: android-release
          retention-days: 7
          path: |
            android/build/outputs/apk/release/*.apk
            android/build/outputs/mapping/release/mapping.txt

  # The build's R8 mapping goes with its release, to read that release's crash traces: CI keeps its files 7 days only.
  mapping:
    needs: [build, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: android-release
          path: apk
      - name: Attach mapping
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION_CODE: ${{ needs.build.outputs.version }}
        run: gh release upload "build-$VERSION_CODE" "$(find apk -name mapping.txt | head -1)"

  # A signed build of main becomes the latest release, where the app's own update check looks. The APK is named by its
  # version, as waveei-1.2.5.apk, so downloaded builds tell themselves apart.
  publish:
    needs: build
    if: github.ref == 'refs/heads/main' && needs.build.outputs.signed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: android-release
          path: apk
      - name: Publish build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION_CODE: ${{ needs.build.outputs.version }}
          VERSION_NAME: ${{ needs.build.outputs.name }}
        # The tag stays build-<code>: installed builds read the code from it. The title is the version people see. The
        # notes are this version's part of CHANGELOG.md, with GitHub's link to the commits below.
        run: |
          file="waveei-$VERSION_NAME.apk"
          cp "$(find apk -name 'android-release.apk' | head -1)" "$file"
          notes=$(awk -v v="## $VERSION_NAME" '$0 == v { on = 1; next } /^## / { on = 0 } on' CHANGELOG.md | sed '/./,$!d')
          gh release create "build-$VERSION_CODE" "$file" \
            --title "$VERSION_NAME" --notes "$notes" --generate-notes --target "$GITHUB_SHA" --latest

  # Each published build starts the developer build of the same commit in the private dev repository. DEV_TOKEN may
  # only start that repository's workflows; without it nothing starts.
  dev:
    needs: [build, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Start the developer build
        env:
          GH_TOKEN: ${{ secrets.DEV_TOKEN }}
          VERSION_NAME: ${{ needs.build.outputs.name }}
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "DEV_TOKEN is not set: no developer build"; exit 0; fi
          gh workflow run ci.yml --repo waveeihq/waveei_dev --ref main -f sha="$GITHUB_SHA" -f name="$VERSION_NAME"
