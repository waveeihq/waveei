name: Delete release

# By hand only: Actions → Delete release → Run workflow, with the release's tag (build-…). The release and its tag go.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: The release's tag (build-…)
        required: true

permissions:
  contents: write

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - run: gh release delete "$TAG" --cleanup-tag --yes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
