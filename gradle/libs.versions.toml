[versions]
agp = "9.4.1"
kotlin = "2.4.20"
serialization = "1.11.0"
okhttp = "5.4.0"
composeBom = "2026.09.00"
activityCompose = "1.13.0"
robolectric = "4.17"
junit4 = "4.13.2"
androidxTestCore = "1.7.0"
customview = "1.2.0"
firebaseBom = "35.1.0"
fragment = "1.9.1"
emojiPicker = "1.7.0"
browser = "1.10.0"
media3 = "1.11.1"

[libraries]
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }

firebase-bom = { module = "com.google.firebase:firebase-bom", version.ref = "firebaseBom" }
firebase-auth = { module = "com.google.firebase:firebase-auth" }
firebase-appcheck-playintegrity = { module = "com.google.firebase:firebase-appcheck-playintegrity" }
fragment = { module = "androidx.fragment:fragment", version.ref = "fragment" }
emoji-picker = { module = "androidx.emoji2:emoji2-emojipicker", version.ref = "emojiPicker" }
browser = { module = "androidx.browser:browser", version.ref = "browser" }
media3-common = { module = "androidx.media3:media3-common", version.ref = "media3" }

customview = { module = "androidx.customview:customview", version.ref = "customview" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-ui = { module = "androidx.compose.ui:ui" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
junit4 = { module = "junit:junit", version.ref = "junit4" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidxTestCore" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
