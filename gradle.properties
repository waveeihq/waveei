org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
kotlin.code.style=official

# Name and id: the single place to change them.
# Kotlin packages use the same root (app.waveei) and are moved together with it.
appName=Waveei
appId=app.waveei
# The Waveei server: accounts, free minutes, payments and the speech model.
serverUrl=https://server-1038010755168.europe-west1.run.app
# The version's major and minor: raise the minor for new features, the major for a big change. CI adds the patch.
appVersion=1.2
# This repository: the app's About links to its source, privacy policy and terms here.
sourceUrl=https://github.com/waveeihq/waveei
# The Google Cloud and Firebase project of the server and the accounts (ids, not secrets).
gcpProject=waveei-76748
firebaseAppId=1:1038010755168:android:62a791b8e4b7260d8f3b05
# Not a secret either: it only names the Firebase project. Google restricts it to app.waveei signed with Waveei's key,
# which stops another build from using it by mistake, not on purpose: the server's own checks guard the service.
firebaseApiKey=AIzaSyDMDnuPhhiUUYdN5zPSrDNjeSUlGfekE6s
